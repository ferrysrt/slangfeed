name: SlangFeed Dataset Pipeline

# Security design (audit fix #1):
# - Job "build" menjalankan kode pihak ketiga (pip install) + secrets TANPA write token.
# - Job "publish" memegang write token TANPA secrets & TANPA runtime install.
# Dengan ini, kompromi dependency tidak bisa mencuri token push, dan
# token push tidak pernah berada di proses yang sama dengan pip install.

on:
  schedule:
    - cron: "0 3 * * 1"   # Setiap Senin 03:00 UTC
  workflow_dispatch:       # Bisa dijalankan manual dari tab Actions

permissions:
  contents: read           # default read; publish job yang minta write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (tanpa kredensial persist)
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # token push tidak pernah dikirim ke job ini

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pipeline
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          python backend/main.py || exit 1

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: |
            data/slang_dataset.csv
            logs/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: dataset

      - name: Commit & push dataset (jika berubah)
        run: |
          git config user.name "Ferry Sirait"
          git config user.email "136626822+ferrysrt@users.noreply.github.com"
          git add data/slang_dataset.csv logs/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan dataset — skip push"
          else
            git commit -m "chore(dataset): weekly auto-update $(date +%Y-%m-%d)"
            git push
          fi
