name: SlangFeed Dataset Pipeline

on:
  schedule:
    - cron: "0 3 * * 1"   # Setiap Senin 03:00 UTC
  workflow_dispatch:       # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pipeline
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          python backend/main.py || exit 1

      - name: Commit & push dataset (jika berubah)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/slang_dataset.csv logs/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan dataset — skip push"
          else
            git commit -m "chore(dataset): weekly auto-update $(date +%Y-%m-%d)"
            git push
          fi
